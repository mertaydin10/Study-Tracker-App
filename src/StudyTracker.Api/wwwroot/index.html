<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Study Tracker</title>
  <link rel="stylesheet" href="/styles.css?v=12" />
</head>
<body>
  <h1>Study Tracker</h1>
  <p id="error"></p>
  <p id="notice"></p>

  <section id="login">
    <h2>Giriş</h2>
    <form id="loginForm">
      <label>E-posta <input id="email" type="email" value="demo@local" required /></label>
      <label>Şifre <input id="password" type="password" value="demo" required /></label>
      <button type="submit">Giriş</button>
    </form>
    <h2>Kayıt</h2>
    <form id="registerForm">
      <label>E-posta <input id="regEmail" type="email" required /></label>
      <label>Şifre <input id="regPassword" type="password" minlength="4" required /></label>
      <label>Ad <input id="regName" maxlength="200" /></label>
      <button type="submit">Kayıt ol</button>
    </form>
  </section>

  <div id="app" class="hidden">
    <p><span id="who"></span>
      <button type="button" class="small" id="renameMe">Adı değiştir</button>
      <button type="button" class="small" id="changePassword">Şifre değiştir</button>
      <button type="button" id="logout">Çıkış</button>
      <a href="/swagger">Swagger</a>
      <button type="button" class="small" id="exportCsv">CSV indir</button></p>

    <section>
      <h2>Özet</h2>
      <p id="stats">—</p>
      <ul id="statsBySubject"></ul>
    </section>

    <section>
      <h2>Konular</h2>
      <ul id="subjects"></ul>
      <form id="subjectForm">
        <label>Yeni konu <input id="subjectName" required /></label>
        <button type="submit">Ekle</button>
      </form>
    </section>

    <section>
      <h2>Oturumlar</h2>
      <label>Konuya göre
        <select id="sessionFilter">
          <option value="">Tümü</option>
        </select>
      </label>
      <div class="filters">
        <label>Başlangıç <input id="fromDate" type="date" /></label>
        <label>Bitiş <input id="toDate" type="date" /></label>
        <button type="button" class="small" id="filterToday">Bugün</button>
        <button type="button" class="small" id="filterWeek">Bu hafta</button>
        <button type="button" class="small" id="clearDates">Tarihleri temizle</button>
      </div>
      <ul id="sessions"></ul>
      <p id="pager">
        <button type="button" class="small" id="prevPage">Önceki</button>
        <span id="pageLabel">1</span>
        <button type="button" class="small" id="nextPage">Sonraki</button>
      </p>
      <form id="sessionForm">
        <label>Konu <select id="subjectId"></select></label>
        <label>Başlangıç <input id="startedAt" type="datetime-local" required /></label>
        <label>Dakika <input id="duration" type="number" min="1" max="1440" value="25" required /></label>
        <label>Not <input id="notes" /></label>
        <p id="sessionHint" class="empty hidden">Önce bir konu ekle.</p>
        <button type="submit">Oturum ekle</button>
      </form>
    </section>
  </div>

  <p id="health" class="empty"></p>

  <script src="/app.js?v=12"></script>
</body>
</html>
